name: commandbar
description: >-
  CommandBar is a product-adoption and in-app user-assistance platform that
  helps SaaS teams onboard, guide, and support users directly inside their web
  applications. Its embeddable widget bundles a command palette / universal
  search (Spotlight), an AI copilot, contextual help (HelpHub), nudges and
  product tours, checklists, and in-app surveys, all driven by a JavaScript SDK
  (npm `commandbar`) that boots against an organization ID. CommandBar was
  founded in 2020, backed by Insight Partners among others, and acquired by
  Amplitude in 2024; the product is now delivered as Amplitude Guides &
  Surveys. The standalone commandbar.com developer surface (SDK reference, REST
  API, changelog) has been retired and redirects to Amplitude, though the npm
  SDK remains published.
